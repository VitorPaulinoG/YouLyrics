<div class="flex flex-row relative"
    (mouseover)="showMenu($event)"
    (mouseleave)="hideMenu($event)"
>
    @if (show()) {
        <div class="absolute py-3.5 z-50" [@menuAnimation] [ngClass]="getMenuPosition()">
            <div class="w-64 h-auto flex flex-col items-center bg-secondary-300 shadow-2xl overflow-clip" 
                [ngClass]="getSharpCornerStyle()">
                @for (option of menuOptions(); track $index) {
                    <div 
                        class="w-full min-h-12 flex flex-row items-center gap-2.5 text-primary-500 p-2.5 
                            hover:bg-secondary-400 active:bg-secondary-500 transition-colors duration-200 ease-in-out"
                        (click)="option.action($event)"
                    >
                        <app-svg-icon [iconConfig]="option.iconConfig" class="w-8 h-8"/>
                        <span>{{option.title}}</span>
                    </div>
                    @if (!$last) {
                        <div class="px-2.5 w-full">
                            <hr class="h-px bg-primary-300 border-0 ">
                        </div>
                    } 
                }
            </div>
        </div>
    }
    <ng-content/>
</div>

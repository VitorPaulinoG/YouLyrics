<div class="flex flex-row rounded-lg bg-secondary-300 px-8 py-1">
    <img src="assets/youlyrics-logo.svg" height="48" alt="YouLyrics Logo">
    <div class="px-7 w-full">
        <app-search-bar class="w-full"/>
    </div>
    <div class="h-12 w-auto flex flex-row gap-2.5">
        <app-svg-icon 
            [iconConfig]="{ svgUrl: 'assets/icons/notification-icon.svg', iconName: 'notification', roundedBackground: true}"
            class="w-10 h-10"
        />
        @if (isAuthenticated) {
            <app-menu [menuOptions]="menuOptions" sharpCornerStyle="Top-Right" menuPosition="Bottom-Left">
                <app-svg-icon 
                    iconName="profile" 
                    [iconConfig]="{ svgUrl: 'assets/icons/profile-icon.svg', iconName: 'profile', roundedBackground: true }"
                    class="w-10 h-10"
                />
            </app-menu>
        } @else {
            <div class="flex items-center text-primary-500 font-medium gap-2.5" (click)="onLoginClick()">
                <app-svg-icon 
                    iconName="profile" 
                    [iconConfig]="{ svgUrl: 'assets/icons/profile-icon.svg', iconName: 'profile', roundedBackground: true }"
                    class="w-10 h-10"
                />
                <span class="text-[0.875rem]">
                    Login
                </span>
            </div>
        }
    </div>
</div>

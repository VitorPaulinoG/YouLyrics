<div class="flex flex-row rounded-lg bg-secondary-300 px-8 py-1">
    <img src="assets/youlyrics-logo.svg" height="48" alt="YouLyrics Logo">
    <div class="px-7 w-full">
        <app-search-bar class="w-full"/>
    </div>
    <div class="h-12 w-auto flex flex-row gap-2.5">
        <app-svg-icon 
            [iconConfig]="{ svgUrl: 'assets/icons/notification-icon.svg', iconName: 'notification' }"
            class="w-12 h-12"
        />

        <app-svg-icon 
            iconName="profile" 
            [iconConfig]="{ svgUrl: 'assets/icons/profile-icon.svg', iconName: 'profile' }"
            class="w-12 h-12"
        />
    </div>
</div>

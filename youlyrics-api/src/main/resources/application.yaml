spring:
  application:
    name: youlyrics-api
  datasource: 
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}?serverTimezone=UTC
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties: 
      hibernate: 
          dialect: org.hibernate.dialect.PostgreSQLDialect
  config:
    import: optional:file:.env[.properties]
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${keycloak-url}/realms/${realm-name}
          jwk-set-uri: ${keycloak-url}/realms/${realm-name}/protocol/openid-connect/certs

logging:
  level: 
    '[org.springframework.security]': DEBUG
    '[org.springframework.security.web.access]': DEBUG
    '[org.springframework.security.oauth2]': DEBUG

server:
  port: 8080
  
springdoc:
  swagger-ui:
    oauth:
      client-id: ${SWAGGER_CLIENT_ID}
      realm: youlyricsc
      app-name: YouLyrics API Docs
      use-pkce-with-authorization-code-grant: true
      additional-query-string-params:
        access_type: offline
        prompt: consent
      scopes: openid,email,profile
    oauth2-redirect-url: http://localhost:8080/swagger-ui/oauth2-redirect.html
    config-url: /v3/api-docs/swagger-config
    urls:
      - url: /v3/api-docs
        name: default
  cache:
    disabled: true 
  api-docs:
    path: /v3/api-docs
  show-login-endpoint: true
  show-oauth2-endpoints: true

keycloak-url: http://youlyrics-keycloak:8080
keycloak-external-url: http://localhost:${KEYCLOAK_HOST_PORT}
realm-name: youlyrics